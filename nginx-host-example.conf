# Ejemplo de server block para el nginx del HOST (fuera de Docker), pensado
# para funcionar detrás de Cloudflare en modo "Full (strict)". Todo lo demás
# (frontend, API, proxy interno a /api) ya vive dentro del contenedor "web" —
# esto es lo único que hace falta añadir al nginx del servidor.
#
# Sustituye "beta.dgarbla.com" por tu dominio/subdominio real, y ajusta el
# puerto si cambiaste WEB_PORT en tu .env.production (por defecto 8081).
#
# Certificado: genera uno gratis en Cloudflare → SSL/TLS → Origin Server →
# Create Certificate, y guárdalo como se indica abajo. Ese certificado NO lo
# valida un navegador directamente — solo Cloudflare habla con tu servidor,
# así que basta con que Cloudflare lo reconozca (y lo reconoce siempre).

server {
    listen 80;
    server_name beta.dgarbla.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beta.dgarbla.com;

    ssl_certificate     /etc/nginx/ssl/esoliupo-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/esoliupo-origin.key;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
