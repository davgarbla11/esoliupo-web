# Ejemplo de server block para el nginx del HOST (fuera de Docker).
# Solo hace falta esto — todo lo demás (frontend, API, proxy interno a /api) ya
# vive dentro del contenedor "web". Ajusta el dominio y el puerto (WEB_PORT en
# tu .env.production, por defecto 8080), y añade tu configuración TLS habitual
# (certbot suele generar ese bloque automáticamente al pedir el certificado).

server {
    listen 80;
    server_name esoliupo.org www.esoliupo.org;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
